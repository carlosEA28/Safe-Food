services:
  postgres-inspection:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspection_db
      POSTGRES_USER: inspection
      POSTGRES_PASSWORD: inspection
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspection -d inspection_db"]
      interval: 5s
      retries: 10
    volumes:
      - inspection_postgres_data:/var/lib/postgresql/data

volumes:
  inspection_postgres_data:
